<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Rest In Pics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b00 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Spooky animated background */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .ghost {
            position: absolute;
            font-size: 3rem;
            opacity: 0.15;
            animation: float 15s infinite ease-in-out;
        }

        .ghost:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .ghost:nth-child(2) { top: 60%; left: 80%; animation-delay: 3s; }
        .ghost:nth-child(3) { top: 30%; left: 70%; animation-delay: 6s; }
        .ghost:nth-child(4) { top: 80%; left: 20%; animation-delay: 9s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
            50% { transform: translateY(-40px) rotate(10deg); opacity: 0.25; }
        }

        .container {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 2px solid rgba(255, 107, 0, 0.3);
            padding: 30px 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 90px rgba(255, 107, 0, 0.3), 0 0 60px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #ff6b00 0%, #ff9500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #ff9500;
            margin-bottom: 24px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .camera-container {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 107, 0, 0.2);
        }

        #video {
            width: 100%;
            display: block;
        }

        #canvas {
            display: none;
        }

        .preview-container {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
            display: none;
        }

        .preview-container img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 107, 0, 0.2);
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #ff9500;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid rgba(255, 107, 0, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: rgba(255, 149, 0, 0.5);
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #ff6b00;
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 130px;
            font-family: inherit;
        }

        .primary {
            background: linear-gradient(135deg, #ff6b00 0%, #ff9500 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
        }

        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.6);
        }

        .secondary {
            background: rgba(255, 107, 0, 0.15);
            color: #ff9500;
            border: 2px solid rgba(255, 107, 0, 0.3);
        }

        .secondary:hover {
            background: rgba(255, 107, 0, 0.25);
            border-color: #ff6b00;
        }

        .success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .message {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
        }

        .message.error {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
        }

        .spinner {
            border: 4px solid rgba(255, 107, 0, 0.2);
            border-top: 4px solid #ff6b00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            color: #ff9500;
            font-weight: 600;
        }

        .file-input-container {
            margin-bottom: 16px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: rgba(255, 107, 0, 0.1);
            border: 2px dashed rgba(255, 107, 0, 0.4);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #ff9500;
        }

        .file-input-label:hover {
            background: rgba(255, 107, 0, 0.2);
            border-color: #ff6b00;
        }

        #fileInput {
            display: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 16px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 2px solid rgba(255, 107, 0, 0.3);
        }

        .divider span {
            padding: 0 15px;
            color: #ff9500;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        .icon {
            font-size: 1.2rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }

            h1 {
                font-size: 1.75rem;
            }

            button {
                min-width: 110px;
                padding: 12px 18px;
                font-size: 0.95rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="ghost">👻</div>
        <div class="ghost">🎃</div>
        <div class="ghost">👻</div>
        <div class="ghost">🦇</div>
    </div>

    <div class="container">
        <h1>⚰️ Rest In Pics ⚰️</h1>
        <p class="subtitle">One last photo before you go... 👻</p>

        <div class="camera-container" id="cameraContainer">
            <video id="video" autoplay playsinline></video>
        </div>

        <canvas id="canvas"></canvas>

        <div class="preview-container" id="previewContainer">
            <img id="preview" alt="Photo preview">
        </div>

        <div class="file-input-container" id="fileInputContainer">
            <label for="fileInput" class="file-input-label">
                <span class="icon">🖼️</span>
                <span>Choose from Gallery</span>
            </label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="divider" id="divider">
            <span>OR</span>
        </div>

        <div class="button-group" id="captureButtons">
            <button class="primary" id="captureBtn">
                <span class="icon">📷</span> Take Photo
            </button>
        </div>

        <div class="form-section" id="formSection">
            <div class="input-group">
                <label for="guestName">Your Name <span style="color: rgba(255, 149, 0, 0.6); font-weight: 400;">(optional)</span></label>
                <input type="text" id="guestName" placeholder="Enter your name" maxlength="50">
            </div>

            <div class="input-group">
                <label for="caption">Caption or Message <span style="color: rgba(255, 149, 0, 0.6); font-weight: 400;">(optional)</span></label>
                <textarea id="caption" placeholder="Leave a spooky message..." maxlength="200"></textarea>
            </div>

            <div class="button-group">
                <button class="secondary" id="retakeBtn">Retake</button>
                <button class="success" id="uploadBtn">Upload Photo</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Capturing your final moment...</p>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const cameraContainer = document.getElementById('cameraContainer');
        const previewContainer = document.getElementById('previewContainer');
        const fileInputContainer = document.getElementById('fileInputContainer');
        const divider = document.getElementById('divider');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const captureButtons = document.getElementById('captureButtons');
        const formSection = document.getElementById('formSection');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');
        const guestNameInput = document.getElementById('guestName');
        const captionInput = document.getElementById('caption');

        const API_URL = window.location.origin;

        let currentFile = null;
        let stream = null;

        // Initialize camera
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.error('Error accessing camera:', err);
                cameraContainer.style.display = 'none';
                divider.style.display = 'none';
                captureButtons.style.display = 'none';
            }
        }

        // Capture photo from camera
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            canvas.toBlob((blob) => {
                currentFile = new File([blob], `photo-${Date.now()}.jpg`, { type: 'image/jpeg' });
                preview.src = URL.createObjectURL(blob);
                showPreview();
            }, 'image/jpeg', 0.95);
        });

        // Handle file input
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                preview.src = URL.createObjectURL(file);
                showPreview();
            }
        });

        function showPreview() {
            cameraContainer.style.display = 'none';
            fileInputContainer.style.display = 'none';
            divider.style.display = 'none';
            previewContainer.style.display = 'block';
            captureButtons.style.display = 'none';
            formSection.classList.add('active');
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            // Focus on name input
            setTimeout(() => guestNameInput.focus(), 300);
        }

        retakeBtn.addEventListener('click', () => {
            cameraContainer.style.display = 'block';
            fileInputContainer.style.display = 'block';
            divider.style.display = 'flex';
            previewContainer.style.display = 'none';
            captureButtons.style.display = 'flex';
            formSection.classList.remove('active');
            currentFile = null;
            fileInput.value = '';
            guestNameInput.value = '';
            captionInput.value = '';
            initCamera();
        });

        uploadBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            uploadBtn.disabled = true;
            retakeBtn.disabled = true;
            loading.style.display = 'block';
            message.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('photo', currentFile);
                formData.append('guestName', guestNameInput.value.trim());
                formData.append('caption', captionInput.value.trim());

                const response = await fetch(`${API_URL}/api/photos`, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error('Upload failed');
                }

                const guestName = guestNameInput.value.trim();
                const thankYouMessage = guestName
                    ? `Rest well, ${guestName}... Your spirit now haunts The Graaveyarrd 🪦👻`
                    : 'Your soul has been captured... See you in The Graaveyarrd 🪦👻';

                showMessage(thankYouMessage, 'success');

                // Reset after 3 seconds
                setTimeout(() => {
                    location.reload();
                }, 3000);
            } catch (err) {
                console.error('Upload error:', err);
                showMessage('Upload failed. Try again!', 'error');
                uploadBtn.disabled = false;
                retakeBtn.disabled = false;
            } finally {
                loading.style.display = 'none';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }

        // Initialize on load
        initCamera();
    </script>
</body>
</html>
