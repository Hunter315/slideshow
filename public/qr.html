<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party QR Code</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Georgia", serif;
        background: linear-gradient(
          135deg,
          #ff6b35 0%,
          #f7931e 50%,
          #ff6b35 100%
        );
        color: #2d1b00;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 800px;
        width: 100%;
        padding: 60px 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        border: 4px solid #ff6b35;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 3em;
        margin-bottom: 20px;
        color: #ff6b35;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .subtitle {
        font-size: 1.5em;
        margin-bottom: 40px;
        color: #5d3a00;
        font-style: italic;
      }

      .qr-container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        display: inline-block;
        margin: 30px 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      #qrcode {
        margin: 0 auto;
      }

      .url-text {
        font-size: 1.3em;
        margin-top: 30px;
        padding: 20px;
        background: #fff3e0;
        border-radius: 10px;
        border: 2px solid #ff6b35;
        font-family: "Courier New", monospace;
        color: #ff6b35;
        font-weight: bold;
      }

      .instructions {
        font-size: 1.2em;
        margin-top: 30px;
        line-height: 1.8;
        color: #5d3a00;
      }

      .print-button {
        margin-top: 30px;
        padding: 15px 40px;
        font-size: 1.3em;
        background: #ff6b35;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: "Georgia", serif;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
      }

      .print-button:hover {
        background: #f7931e;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 107, 53, 0.6);
      }

      @media print {
        body {
          background: white;
        }
        .container {
          box-shadow: none;
          border: none;
        }
        .print-button {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎃 Rest In Pics 🎃</h1>

      <div class="qr-container">
        <div id="qrcode"></div>
      </div>

      <div class="url-text" id="urlText">Loading...</div>

      <button class="print-button" onclick="window.print()">🖨️</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
      // Get the current URL and generate QR code
      async function generateQR() {
        try {
          // Fetch server info to get the IP address
          const response = await fetch("/api/server-info");
          const data = await response.json();
          const uploadUrl = data.uploadUrl;

          // Display URL
          document.getElementById("urlText").textContent = uploadUrl;

          // Generate QR code
          new QRCode(document.getElementById("qrcode"), {
            text: uploadUrl,
            width: 300,
            height: 300,
            colorDark: "#ff6b35",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H,
          });
        } catch (error) {
          console.error("Error generating QR code:", error);
          document.getElementById("urlText").textContent =
            "Error loading QR code";
        }
      }

      generateQR();
    </script>
  </body>
</html>
